<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitio en pausa — Enfoque</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">🧘</div>
    <h1>Respira. Este sitio está en pausa.</h1>
    <p class="domain" id="domain">sitio bloqueado</p>
    <p class="reason" id="reason">Está dentro de tu horario de enfoque.</p>

    <div class="counter">
      <span class="number" id="attempts">0</span>
      <span class="label">intentos de hoy</span>
    </div>

    <div class="grace-box">
      <p id="graceInfo">Te quedan <strong id="graceLeft">2</strong> pases de gracia hoy.</p>
      <p class="hint">Cada pase te libera por 5 minutos. Solo 2 al día, úsalos con sabiduría.</p>
      <div class="row">
        <button id="graceBtn">Usar 5 minutos de gracia</button>
        <button id="backBtn" class="ghost">Volver atrás</button>
      </div>
      <p class="countdown" id="countdown" hidden></p>
    </div>

    <p class="from">Intentabas visitar: <code id="from"></code></p>
    <a href="../options/options.html" target="_blank" class="config-link">Ajustar horarios →</a>
  </main>
  <script src="../lib/utils.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
